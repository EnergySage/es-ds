name: ci

on:
    workflow_call:
    pull_request:
        branches:
            - main

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout 🛎
              uses: actions/checkout@v4

            # Downstream apps must install the exact Nuxt version es-ds-components lists as a peer, so it is
            # pinned to that same version everywhere here; the docs release install fails with ERESOLVE otherwise.
            - name: Check Nuxt version pins match
              run: |
                  peer=$(jq -r '.peerDependencies.nuxt' es-ds-components/package.json)
                  dev=$(jq -r '.devDependencies.nuxt' es-ds-components/package.json)
                  docs=$(jq -r '.dependencies.nuxt' es-ds-docs/package.json)
                  if ! [[ "$peer" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$dev" != "$peer" ] || [ "$docs" != "$peer" ]; then
                      echo "::error::nuxt must be the same exact version in es-ds-components peerDependencies ($peer), es-ds-components devDependencies ($dev) and es-ds-docs dependencies ($docs)"
                      exit 1
                  fi

            - name: Get nodenv version 🔌
              id: nodenv
              shell: bash
              run: echo "node-version=$(cat .node-version)" >> $GITHUB_OUTPUT

            - name: Setup node env 🏗
              uses: actions/setup-node@v4
              with:
                  node-version: '${{ steps.nodenv.outputs.node-version }}'
                  check-latest: true

            - name: Install dependencies 👨🏻‍💻
              run: |
                make install
                make symlink

            # `npm install` (in make install) triggers es-ds-docs' postinstall, which runs
            # `nuxt prepare` against the published @energysage/es-ds-components from the lockfile —
            # before `make symlink` swaps in the local layer. Re-prepare with a clean .nuxt so the
            # auto-import types reflect the symlinked layer's current source.
            - name: Re-prepare Nuxt against symlinked layer
              working-directory: ./es-ds-docs
              run: rm -rf .nuxt && npx nuxi prepare

            - name: Building
              run: make build

            - name: Run linter 👀
              run: make lint

            - name: Run typechecker
              run: make typecheck

            - name: Run tests 🧪
              run: make test
