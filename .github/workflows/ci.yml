name: ci

on:
    workflow_call:
    pull_request:
        branches:
            - main

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout 🛎
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

            - name: Get nodenv version 🔌
              id: nodenv
              shell: bash
              run: echo "node-version=$(cat .node-version)" >> $GITHUB_OUTPUT

            - name: Setup node env 🏗
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version: '${{ steps.nodenv.outputs.node-version }}'
                  check-latest: true

            # es-ds-components and es-ds-docs develop against one exact Nuxt version, which must satisfy the
            # es-ds-components peer range; the docs release install fails with ERESOLVE otherwise. The peer is
            # temporarily a range so downstream apps already on Nuxt 4.6.x can install es-ds.
            - name: Check Nuxt versions match
              run: |
                  peer=$(jq -r '.peerDependencies.nuxt' es-ds-components/package.json)
                  dev=$(jq -r '.devDependencies.nuxt' es-ds-components/package.json)
                  docs=$(jq -r '.dependencies.nuxt' es-ds-docs/package.json)
                  if [ "$dev" != "$docs" ] || ! npx semver@7.8.6 -r "$peer" "$dev" > /dev/null; then
                      echo "::error::nuxt must be the same exact version in es-ds-components devDependencies ($dev) and es-ds-docs dependencies ($docs), and satisfy es-ds-components peerDependencies ($peer)"
                      exit 1
                  fi

            - name: Install dependencies 👨🏻‍💻
              run: |
                make install
                make symlink

            # `npm install` (in make install) triggers es-ds-docs' postinstall, which runs
            # `nuxt prepare` against the published @energysage/es-ds-components from the lockfile —
            # before `make symlink` swaps in the local layer. Re-prepare with a clean .nuxt so the
            # auto-import types reflect the symlinked layer's current source.
            - name: Re-prepare Nuxt against symlinked layer
              working-directory: ./es-ds-docs
              run: rm -rf .nuxt && npx nuxi prepare

            - name: Building
              run: make build

            - name: Run linter 👀
              run: make lint

            - name: Run typechecker
              run: make typecheck

            - name: Run tests 🧪
              run: make test
