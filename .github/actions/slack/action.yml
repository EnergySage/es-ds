name: slack

inputs:
    slack-channel:
        description: Slack channel name
        required: true
        default: ''
    slack-token:
        description: Slack bot token
        required: true
        default: ''
    slack-message:
        description: Slack Message
        required: true
        default: ''

runs:
    using: composite
    steps:
        - name: Post to a Slack channel
          id: slack
          uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
          with:
              method: chat.postMessage
              token: ${{ inputs.slack-token }}
              # toJSON quotes the values; an unquoted channel like "#foo" would
              # otherwise parse as a YAML comment, sending channel: null
              payload: |
                  channel: ${{ toJSON(inputs.slack-channel) }}
                  text: ${{ toJSON(inputs.slack-message) }}
